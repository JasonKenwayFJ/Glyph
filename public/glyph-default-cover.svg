<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12121a"/>
      <stop offset="55%" stop-color="#1a1730"/>
      <stop offset="100%" stop-color="#0d0d14"/>
    </linearGradient>

    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c6cf0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c6cf0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3ec9b0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3ec9b0" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- base -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <!-- ambient glows -->
  <circle cx="1180" cy="220" r="420" fill="url(#glow1)"/>
  <circle cx="360" cy="720" r="380" fill="url(#glow2)"/>

  <!-- central glyph mark, offset right-of-center -->
  <g transform="translate(1060,450)" opacity="0.9" filter="url(#soft)">
    <circle r="190" fill="none" stroke="#8f7ff5" stroke-opacity="0.35" stroke-width="1.4"/>
    <circle r="140" fill="none" stroke="#8f7ff5" stroke-opacity="0.5" stroke-width="1.2"/>
    <circle r="140" fill="none" stroke="#8f7ff5" stroke-opacity="0.18" stroke-width="26"/>

    <!-- inner rune lines -->
    <g stroke="#c9c2fb" stroke-opacity="0.75" stroke-width="1.6" fill="none" stroke-linecap="round">
      <path d="M0,-96 L0,-40 M0,40 L0,96"/>
      <path d="M-96,0 L-40,0 M40,0 L96,0"/>
      <path d="M-68,-68 L-30,-30 M30,30 L68,68"/>
      <path d="M68,-68 L30,-30 M-30,30 L-68,68"/>
      <circle r="14" fill="#c9c2fb" fill-opacity="0.85" stroke="none"/>
      <path d="M0,-58 L20,0 L0,58 L-20,0 Z" fill="none" stroke="#c9c2fb" stroke-opacity="0.6" stroke-width="1"/>
    </g>

    <!-- orbiting ticks -->
    <g stroke="#3ec9b0" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round">
      <path d="M0,-190 L0,-176"/>
      <path d="M134,-134 L124,-124"/>
      <path d="M190,0 L176,0"/>
      <path d="M134,134 L124,124"/>
      <path d="M0,190 L0,176"/>
      <path d="M-134,134 L-124,124"/>
      <path d="M-190,0 L-176,0"/>
      <path d="M-134,-134 L-124,-124"/>
    </g>
  </g>

  <!-- secondary faint mark, lower-left -->
  <g transform="translate(300,690) scale(0.55)" opacity="0.35" filter="url(#soft)">
    <circle r="140" fill="none" stroke="#3ec9b0" stroke-opacity="0.4" stroke-width="1.4"/>
    <path d="M0,-96 L0,96 M-96,0 L96,0 M-68,-68 L68,68 M68,-68 L-68,68"
          stroke="#3ec9b0" stroke-opacity="0.5" stroke-width="1.4" stroke-linecap="round"/>
    <circle r="12" fill="#3ec9b0" fill-opacity="0.6"/>
  </g>

  <!-- subtle top vignette for card-title legibility if overlaid -->
  <rect width="1600" height="260" fill="url(#vig)"/>
  <linearGradient id="vig" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#0a0a10" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#0a0a10" stop-opacity="0"/>
  </linearGradient>
</svg>
